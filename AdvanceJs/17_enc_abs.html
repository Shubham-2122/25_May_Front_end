<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Enc : private data
    abs : hide access  -->

    <script>

        function Person(name,age){

            let _name = name;
            let _age = age; 

            this.getName=()=>{
                return _name
            }
            this.getAge=()=>{
                return _age;
            }

        }

        const user = new Person("shubham",28)
        console.log(user._name)
        console.log(user._age)
        console.log(user.getName())
        console.log(user.getAge())

    </script>

</body>
</html>
