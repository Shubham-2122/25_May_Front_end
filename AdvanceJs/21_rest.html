<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- rest : ... : total function 
    spred : ... array yua objext -->

    <script>

        function test(...runs){
            let total = 0;
            for(let demo in runs){
                total = total + runs[demo]
            }
            return total
        }

        console.log(test(1,2,3,4,6,7,8,9,10))

    </script>
</body>
