<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 
    fetch : inbuilt function

    <script>

        fetch("data.txt",{
            method:"GET"

        })
        .then((data)=>{
            console.log(data)
            document.write(data)
        })
