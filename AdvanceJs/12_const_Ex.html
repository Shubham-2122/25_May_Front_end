<body>
    <script>

        class Arith{
            constructor(a,b){
                this.a = a;
                this.b = b;
            }
            sum(){
                console.log(`Sum : ${this.a + this.b} `)
            }
            sub(){
                console.log(`Sub : ${this.a - this.b} `)
            }
            mul(){
                console.log(`Mul : ${this.a * this.b} `)
            }
            divi(){
                console.log(`divi : ${this.a / this.b} `)
            }
        }

        const user = new Arith(40,20);
        user.sum()
        user.mul()
        user.sub()

    </script>
</body>
