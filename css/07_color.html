<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- property-name: value -->
    <h1 style="color: lightcoral;">Normal color</h1>
    <h1 style="color: blue;">Normal color</h1>

    <h1 style="color: #53e918;">Hexa #000 #fff color</h1>

    <!-- red,green,blue () 0 -255 ,a ,aplph 0-1-->
    <h1 style="color: rgb(47, 86, 214);">rgb color</h1>
    <h1 style="color: rgba(47, 86, 214,0.6);">rgba color</h1>


    <h1 style="background-color: rgba(47, 214, 75, 0.603);color: white;">rgba color</h1>

    <!-- hsl  -->
    <h1 style="background-color: hsl(255, 72%, 19%);">rgba color</h1>

    <h1 style="background-color: hsla(255, 72%, 19%,0.5);">rgba color</h1>
</body>

</html>
