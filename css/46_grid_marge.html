<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: grid;
            /* grid-template-columns: 100px 400px 200px; */
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-columns: 2fr 3fr;
            grid-template-columns: repeat(3,1fr);
            /* grid-template-rows: 100px 200px; */
            grid-auto-rows: 200px;
            gap: 10px;
        }
        .box{
            border: 2px solid;
        }
        #box5{
            background-color: aqua;
            grid-row: 1;
            grid-column: 1;
        }
        #box3{
            /* grid-row: 2/4; */
            grid-column: 1/3;
        }
    </style>
</head>
<body>
    <!-- layout 2d Row and Col -->

    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box" id="box3">3</div>
        <div class="box">4</div>
        <div class="box" id="box5">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>

</body>
</html>
