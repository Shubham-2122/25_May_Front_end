<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" placeholder="Enter your Num 1" id="num1" value="">
    <input type="text" placeholder="Enter your Num 2" id="num2"> <br> <br>
    <button onclick="sum()">Sum</button>
    <button onclick="sub()">Sub</button>
    <button onclick="mul()">Sub</button>

    <h1 id="h1"></h1>

    <script>

        let num1 = document.getElementById("num1")
        let num2 = document.getElementById("num2")
        // console.log(num1)
        // console.log(num2)

        function sum(){
            let data = parseInt(num1.value) + parseInt(num2.value)
            console.log(data)
            // document.write("sum : ",data)
            document.getElementById("h1").innerHTML = "Sum : "+data;
        }

        function sub(){
            let data = parseInt(num1.value) - parseInt(num2.value)
            console.log(data)
            // document.write("sum : ",data)
            document.getElementById("h1").innerHTML = "Sub : "+data;
        }

         function mul(){
            let data = parseInt(num1.value) * parseInt(num2.value)
            console.log(data)
            document.getElementById("h1").innerHTML = `Mul : ${data}`
        }

    </script>

</body>
</html>
