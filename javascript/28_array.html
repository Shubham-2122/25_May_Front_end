<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- array : collection multiple data store single varibale (primtive datatype)
    array : [], index start 0 -->

    <script>

        let arr = [1,2,3,"shubham","karan",true,45]
        console.log(arr)

        // just only 

        // console.log(arr[3])

        // loop all data show \\
        for(let index=0;index<arr.length;index++){
            // console.log(index)
            // console.log(arr[index])
            document.write(arr[index],"<br>")
        }

        // for of value show

        for(let data of arr){
            console.log(data)
        }

        // for in index and value
        for(let data in arr){
            // console.log(data)
            console.log(arr[data])
        }

    </script>

</body>
</html>
