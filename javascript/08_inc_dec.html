<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- inc pre , post inc -->

    <script>

        let a = 10; 
        console.log("A : ",a);
        a++;
        console.log("A : ",a);//11
        ++a
        console.log("A : ",a); //12

        // post inc ++
        console.log("A : ",a++);
        console.log("A : ",a); //13

        // pre ++inc
        console.log("A : ",++a); //14

        console.log("A : ",a++); // 15
        console.log("A : ",++a); //16
        console.log("A : ",a++); //17
        console.log("A : ",++a); //18
        console.log("A : ",++a); //19
        console.log("A : ",a++); //20
        console.log("A : ",++a); //21
        console.log("A : ",a++); //22
        console.log("A : ",++a); //23
        console.log("A : ",a);

        
        console.log("A : ",a--);
        console.log("A : ",--a);
        console.log("A : ",a--); 
        console.log("A : ",a--); 
        console.log("A : ",--a); 
        console.log("A : ",a--); 
        console.log("A : ",--a); 
        console.log("A : ",a--); 
        console.log("A : ",--a); 
        console.log("A : ",a);



    </script>
</body>
</html>
