<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- dataype 
        1) primitive and 
        2) non-primitive : array and object 
        
        primtive : 
            1) number 
            2) string 
            3) booleon
            4) null 
            5) undefined 
            6) bigINT 
            7) symbols 
    -->

    <script>
        
        // 1) number 
        let a = 2.9;
        console.log(a)
        console.log(typeof(a))

        // 2) string 
        let name = "hello"
        console.log(name)
        console.log(typeof(name))

        // 3) boolen : true and false 
        let data = false 
        console.log(data)
        console.log(typeof(data))

        // 4) undefiend 
        let b;
        console.log(b)
        console.log(typeof(b))

        // 5) null 
        let key = null 
        console.log(key)
        console.log(typeof(key))

        // 6) bigInt 
        let nav = BigInt(325436534643)
        console.log(nav)
        console.log(typeof(nav))

    </script>
</body>
</html>
